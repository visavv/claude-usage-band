<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="236" viewBox="0 0 1320 236" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>usage-band in the Claude desktop Code tab</title>
  <rect width="1320" height="236" fill="#181818"/>
  <!-- band card -->
  <rect x="24" y="22" width="1272" height="138" rx="14" fill="#262625"/>
  <!-- header line: model, folder, cost, status, 7d plan -->
  <text x="48" y="58" font-size="17" fill="#9b9a97">claude-opus-5-5  ·  my-project  ·  $4.20</text>
  <rect x="352" y="40" width="440" height="27" rx="3" fill="#e5534b"/>
  <text x="362" y="59" font-size="17" font-weight="700" fill="#ffffff">🔥 64% of 7d quota expires in 20h41m — USE IT!</text>
  <text x="816" y="58" font-size="17" fill="#d9a441">7d plan: use ~78% of each 5h window (5 windows left)</text>

  <!-- meter 1: ctx -->
  <g transform="translate(48,84)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#ecebe8">ctx</text>
    <g transform="translate(58,4)">
      <rect y="3" width="150" height="9" rx="4.5" fill="#888" fill-opacity="0.3"/>
      <rect y="3" width="46" height="9" rx="4.5" fill="#5fae7b"/>
    </g>
    <text x="224" y="16" font-size="18" font-weight="700" fill="#ecebe8">31%</text>
    <text x="0" y="46" font-size="17" fill="#9b9a97">context window</text>
  </g>
  <!-- meter 2: 5h with pace tick (grey) and 7d-plan target (orange) -->
  <g transform="translate(360,84)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#ecebe8">5h</text>
    <g transform="translate(58,4)">
      <rect y="3" width="150" height="9" rx="4.5" fill="#888" fill-opacity="0.3"/>
      <rect y="3" width="63" height="9" rx="4.5" fill="#d9a441"/>
      <rect x="95" y="-2" width="3" height="19" rx="1.5" fill="#999"/>
      <rect x="121" y="-2" width="3" height="19" rx="1.5" fill="#d97757"/>
    </g>
    <text x="224" y="16" font-size="18" font-weight="700" fill="#ecebe8">42%</text>
    <text x="0" y="46" font-size="17" fill="#9b9a97">1.9M / 4.5M · 1h52m left</text>
  </g>
  <!-- meter 3: 7d -->
  <g transform="translate(672,84)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#ecebe8">7d</text>
    <g transform="translate(58,4)">
      <rect y="3" width="150" height="9" rx="4.5" fill="#888" fill-opacity="0.3"/>
      <rect y="3" width="54" height="9" rx="4.5" fill="#c86fd0"/>
      <rect x="131" y="-2" width="3" height="19" rx="1.5" fill="#999"/>
    </g>
    <text x="224" y="16" font-size="18" font-weight="700" fill="#ecebe8">36%</text>
    <text x="0" y="46" font-size="17" fill="#9b9a97">9.6M / 26.7M · 20h41m left</text>
  </g>
  <!-- meter 4: Codex -->
  <g transform="translate(984,84)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#5fae7b">◇ 7d</text>
    <g transform="translate(58,4)">
      <rect y="3" width="150" height="9" rx="4.5" fill="#888" fill-opacity="0.3"/>
      <rect y="3" width="18" height="9" rx="4.5" fill="#d9a441"/>
      <rect x="47" y="-2" width="3" height="19" rx="1.5" fill="#999"/>
    </g>
    <text x="224" y="16" font-size="18" font-weight="700" fill="#ecebe8">12%</text>
    <text x="0" y="46" font-size="17" fill="#9b9a97">Codex 6m ago · 4d19h left</text>
  </g>

  <!-- prompt box -->
  <rect x="24" y="176" width="1272" height="48" rx="14" fill="#1f1f1e" stroke="#3a3a38"/>
  <text x="48" y="206" font-size="17" fill="#6f6e6b">Ask Claude to…</text>
</svg>
