<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>How to read a meter</title>
  <rect width="900" height="300" rx="14" fill="#262625"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#ecebe8">How to read a meter</text>

  <!-- top callout: pace tick -->
  <g font-size="16" fill="#c9c7c2">
    <text x="330" y="88"><tspan font-weight="700" fill="#bdbdbd">grey tick</tspan> = where on-pace use would be right now</text>
    <line x1="493" y1="96" x2="493" y2="118" stroke="#999" stroke-width="2"/>
  </g>

  <!-- the meter -->
  <g transform="translate(150,124)">
    <text x="-92" y="22" font-size="26" font-weight="700" fill="#ecebe8">5h</text>
    <rect y="6" width="540" height="18" rx="9" fill="#888" fill-opacity="0.3"/>
    <rect y="6" width="227" height="18" rx="9" fill="#d9a441"/>
    <rect x="341" y="-4" width="5" height="38" rx="2.5" fill="#999"/>
    <rect x="435" y="-4" width="5" height="38" rx="2.5" fill="#d97757"/>
    <text x="560" y="24" font-size="26" font-weight="700" fill="#ecebe8">42%</text>
  </g>

  <!-- bottom callouts -->
  <g font-size="16" fill="#c9c7c2">
    <line x1="263" y1="152" x2="263" y2="178" stroke="#d9a441" stroke-width="2"/>
    <text x="110" y="198"><tspan font-weight="700" fill="#d9a441">fill</tspan> = used so far,</text>
    <text x="110" y="220">coloured by pace</text>

    <line x1="587" y1="164" x2="587" y2="178" stroke="#d97757" stroke-width="2"/>
    <text x="480" y="198"><tspan font-weight="700" fill="#d97757">orange tick</tspan> = where this 5h window</text>
    <text x="480" y="220">should end to use up the whole week</text>
  </g>

  <!-- colour legend -->
  <line x1="40" y1="246" x2="860" y2="246" stroke="#3a3a38"/>
  <g transform="translate(40,276)" font-size="15" fill="#9b9a97">
    <circle cx="7" cy="-5" r="7" fill="#5fae7b"/><text x="22" y="0">on pace</text>
    <circle cx="137" cy="-5" r="7" fill="#d9a441"/><text x="152" y="0">over 10 points behind</text>
    <circle cx="347" cy="-5" r="7" fill="#c86fd0"/><text x="362" y="0">over 25 points behind</text>
    <circle cx="557" cy="-5" r="7" fill="#e5534b"/><text x="572" y="0">90% or more used</text>
  </g>
</svg>
